services:
  - type: web
    name: mangan
    runtime: node
    plan: free
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_EMAIL
        value: admin@mangan.com
      - key: ADMIN_PASSWORD
        value: admin_123
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: MANGAN
      - key: GEOCODER_USER_AGENT
        value: "MANGAN/1.0 (add your contact email or URL)"
      - key: WEATHER_USER_AGENT
        value: "MANGAN/1.0 (add your contact email or URL)"
