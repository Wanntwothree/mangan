services:
  - type: web
    name: mangan
    runtime: node
    plan: free
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEOCODER_USER_AGENT
        value: "MANGAN/1.0 (add your contact email or URL)"
      - key: WEATHER_USER_AGENT
        value: "MANGAN/1.0 (add your contact email or URL)"
